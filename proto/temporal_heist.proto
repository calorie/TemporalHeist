syntax = "proto3";
package temporal_heist.v1;

// All coordinates are millimetres; time is authority ticks at 60 Hz.
message Input {
  uint32 protocol_major = 1;
  string room_epoch = 2;
  uint32 player_id = 3;
  string session_id = 4;
  uint64 sequence = 5;
  sint32 move_x = 6;
  sint32 move_z = 7;
  InputKind kind = 8;
  uint32 target_id = 9;
}
enum InputKind {
  UNSPECIFIED = 0;
  JOIN = 1;
  MOTION = 2;
  ACTION = 3;
  LEAVE = 4;
  READY = 5;
  RESTART = 6;
}
message Pose {
  uint32 player_id = 1;
  sint32 x_mm = 2;
  sint32 z_mm = 3;
  uint64 source_tick = 4;
  bool echo = 5;
}
message Mechanism {
  uint32 id = 1;
  bool active = 2;
  uint32 live_presence = 3;
  uint32 echo_presence = 4;
}
message AppliedAction {
  uint64 id = 1;
  uint32 player_id = 2;
  uint32 target_id = 3;
  uint64 acceptance_tick = 4;
  bool echo_capable = 5;
  bool echo_pulse = 6;
}
// Every Snapshot is independently decodable, including within a fetched group.
message Snapshot {
  uint32 protocol_major = 1;
  string room_epoch = 2;
  uint64 server_tick = 3;
  repeated Pose players = 4;
  repeated Pose echoes = 5;
  repeated Mechanism plates = 6;
  repeated Mechanism doors = 7;
  repeated AppliedAction actions = 8;
  repeated Session sessions = 9;
  RoomState room = 10;
  repeated Hazard hazards = 11;
  repeated Guard guards = 12;
}
message Session {
  uint32 player_id = 1;
  string session_id = 2;
  bool connected = 3;
  bool ready = 4;
}
enum RoomPhase {
  ROOM_PHASE_UNSPECIFIED = 0;
  LOBBY = 1;
  ACTIVE = 2;
  WON = 3;
  FAILED = 4;
}
enum FailureReason {
  FAILURE_REASON_UNSPECIFIED = 0;
  TIMEOUT = 1;
  SURVEILLANCE = 2;
  GUARD = 3;
}
message RoomState {
  RoomPhase phase = 1;
  uint32 attempt = 2;
  uint64 started_tick = 3;
  uint64 ended_tick = 4;
  uint64 deadline_tick = 5;
  uint32 ready_players = 6;
  uint32 extraction_players = 7;
  bool echo_opened_final_door = 8;
  FailureReason failure_reason = 9;
  uint32 failure_hazard_id = 10;
  uint32 failure_guard_id = 11;
}
message Hazard {
  uint32 id = 1;
  bool active = 2;
  uint32 detected_player_id = 3;
}
enum GuardState {
  GUARD_STATE_UNSPECIFIED = 0;
  PATROL = 1;
  INVESTIGATE = 2;
  RETURN = 3;
}
message Guard {
  uint32 id = 1;
  sint32 x_mm = 2;
  sint32 z_mm = 3;
  sint32 facing_x = 4;
  sint32 facing_z = 5;
  GuardState state = 6;
  uint32 waypoint_id = 7;
  GuardTarget investigation_target = 8;
  uint64 state_entered_tick = 9;
  uint64 search_expires_tick = 10;
}
message GuardTarget {
  sint32 x_mm = 1;
  sint32 z_mm = 2;
}
message TimelineChunk {
  uint32 protocol_major = 1;
  string room_epoch = 2;
  repeated Snapshot samples = 3;
}
