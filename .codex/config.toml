# Project-level configuration loaded by Codex for trusted projects.
# Keep reasoning at the runtime/model default for ordinary work.
# Multi-agent capability remains available for tasks where delegation improves throughput.

[agents]
enabled = true

[marketplaces.agentic-engineering]
source_type = "git"
source = "https://github.com/calorie/agentic-engineering.git"
sparse_paths = [".agents/plugins", "plugins/agentic-engineering"]

[plugins."agentic-engineering@agentic-engineering"]
enabled = true
