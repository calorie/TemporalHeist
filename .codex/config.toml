# Project-level configuration loaded by Codex for trusted projects.
# Optimize long-running engineering throughput on ChatGPT Plus:
# - primary agent: GPT-5.6 Sol at low effort;
# - delegated subagents: GPT-5.6 Terra at medium effort by default;
# - task decomposition and agent responsibilities are chosen dynamically by
#   agentic-engineering/runtime orchestration rather than static named roles.
#
# Routine repository development should proceed autonomously. Human approval is
# reserved for explicit merge/integration boundaries and important design choices.

model = "gpt-5.6-sol"
model_reasoning_effort = "low"

default_permissions = "agentic-development"

[approval_policy.granular]
sandbox_approval = false
rules = true
mcp_elicitations = false
request_permissions = false
skill_approval = false

[permissions.agentic-development]
description = "Autonomous repository development with writable Git metadata"
extends = ":workspace"

[permissions.agentic-development.filesystem.":workspace_roots"]
"." = "write"
".git" = "write"

[permissions.agentic-development.network]
enabled = true

[agents]
enabled = true
default_subagent_model = "gpt-5.6-terra"
default_subagent_reasoning_effort = "medium"

[marketplaces.agentic-engineering]
source_type = "git"
source = "https://github.com/calorie/agentic-engineering.git"
sparse_paths = [".agents/plugins", "plugins/agentic-engineering"]

[plugins."agentic-engineering@agentic-engineering"]
enabled = true
