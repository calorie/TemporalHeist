services:
  relay:
    build:
      dockerfile: containers/Dockerfile
    entrypoint: []
    extends:
      file: compose.yaml
      service: dev
    command: /build/target/release/moq-relay /workspace/spikes/transport/relay.toml
  authority:
    extends:
      file: compose.yaml
      service: dev
    command: cargo run --manifest-path spikes/transport/Cargo.toml
  web:
    extends:
      file: compose.yaml
      service: dev
    command: npx vite spikes/transport --host 0.0.0.0
    environment:
      __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS: web
