services:
  dev:
    build:
      context: .
      dockerfile: containers/Dockerfile
    init: true
    working_dir: /workspace
    environment:
      TH_AGENT_ID: ${TH_AGENT_ID:?Use sh container AGENT_RUN_ID ...}
      CARGO_TARGET_DIR: /build/target
      CARGO_BUILD_JOBS: "2"
      npm_config_cache: /cache/npm
    volumes:
      - .:/workspace
      - cargo-registry:/usr/local/cargo/registry
      - cargo-git:/usr/local/cargo/git
      - target:/build/target
      - node-modules:/workspace/node_modules
      - npm-cache:/cache/npm
      - artifacts:/artifacts
      - certificates:/certificates
    shm_size: 1gb
volumes:
  cargo-registry:
  cargo-git:
  target:
  node-modules:
  npm-cache:
  artifacts:
  certificates:
