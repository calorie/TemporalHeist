services:
  dev: &dev
    build:
      context: .
      dockerfile: containers/Dockerfile
    init: true
    working_dir: /workspace
    environment:
      TH_AGENT_ID: ${TH_AGENT_ID:?Use sh container AGENT_RUN_ID ...}
      CARGO_TARGET_DIR: /build/target
      CARGO_BUILD_JOBS: "2"
      npm_config_cache: /cache/npm
      TH_ROOM_ID: ${TH_AGENT_ID}
      TH_E2E_MOVE_TIMEOUT_MS: ${TH_E2E_MOVE_TIMEOUT_MS:-45000}
      TH_E2E_START_DELAY_MS: ${TH_E2E_START_DELAY_MS:-0}
    volumes:
      - .:/workspace
      - cargo-registry:/usr/local/cargo/registry
      - cargo-git:/usr/local/cargo/git
      - target:/build/target
      - node-modules:/workspace/node_modules
      - npm-cache:/cache/npm
      - artifacts:/artifacts
      - certificates:/certificates
    shm_size: 1gb
  relay:
    image: moqdev/moq-relay:0.14.18@sha256:3302517b2364ad8297772cbdcb8fe227da966e4d2cc48c6cea9faae5946889fb
    command: ["/config/relay.toml"]
    volumes:
      - ./spikes/transport/relay.toml:/config/relay.toml:ro
    init: true
  authority:
    image: temporal-heist-authority:${TH_RELEASE_IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: containers/Runtime.Dockerfile
      target: authority
      args: &release-args
        TH_RELEASE_SOURCE: ${TH_RELEASE_SOURCE:-https://github.com/calorie/TemporalHeist}
        TH_RELEASE_REVISION: ${TH_RELEASE_REVISION:-unknown}
        TH_RELEASE_VERSION: ${TH_RELEASE_VERSION:-dev}
        TH_RELEASE_CREATED: ${TH_RELEASE_CREATED:-1970-01-01T00:00:00Z}
    environment:
      TH_ROOM_ID: ${TH_AGENT_ID:?Use sh container AGENT_RUN_ID ...}
    depends_on: [relay]
    restart: on-failure
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
  web:
    image: temporal-heist-web:${TH_RELEASE_IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: containers/Runtime.Dockerfile
      target: web
      args: *release-args
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
  browser:
    build: &browser-build
      context: .
      dockerfile: containers/Runtime.Dockerfile
      target: browser
    profiles: ["test"]
    command: ["node", "tests/e2e.mjs"]
    init: true
    shm_size: 1gb
    environment: &browser-environment
      TH_AGENT_ID: ${TH_AGENT_ID:?Use sh container AGENT_RUN_ID ...}
      TH_ROOM_ID: ${TH_AGENT_ID}
      TH_E2E_MOVE_TIMEOUT_MS: ${TH_E2E_MOVE_TIMEOUT_MS:-45000}
      TH_E2E_START_DELAY_MS: ${TH_E2E_START_DELAY_MS:-0}
    volumes:
      - artifacts:/artifacts
  visual-browser-a: &visual-browser
    build:
      context: .
      dockerfile: containers/Runtime.Dockerfile
      target: visual-browser
    profiles: ["visual"]
    entrypoint: ["sh", "containers/visual-entrypoint.sh"]
    init: true
    shm_size: 1gb
    depends_on: [web]
    environment:
      <<: *browser-environment
      TH_PLAYER_ID: "1"
    ports:
      - "127.0.0.1::6080"
    volumes:
      - artifacts:/artifacts
      - visual-profile-a:/browser-profile
  visual-browser-b:
    <<: *visual-browser
    environment:
      TH_AGENT_ID: ${TH_AGENT_ID:?Use sh container AGENT_RUN_ID ...}
      TH_ROOM_ID: ${TH_AGENT_ID}
      TH_PLAYER_ID: "2"
    volumes:
      - artifacts:/artifacts
      - visual-profile-b:/browser-profile
volumes:
  cargo-registry:
  cargo-git:
  target:
  node-modules:
  npm-cache:
  artifacts:
  certificates:
  visual-profile-a:
  visual-profile-b:
