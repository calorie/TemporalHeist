services:
  dev: &dev
    build:
      context: .
      dockerfile: containers/Dockerfile
    init: true
    working_dir: /workspace
    environment:
      TH_AGENT_ID: ${TH_AGENT_ID:?Use sh container AGENT_RUN_ID ...}
      CARGO_TARGET_DIR: /build/target
      CARGO_BUILD_JOBS: "2"
      npm_config_cache: /cache/npm
      TH_ROOM_ID: ${TH_AGENT_ID}
    volumes:
      - .:/workspace
      - cargo-registry:/usr/local/cargo/registry
      - cargo-git:/usr/local/cargo/git
      - target:/build/target
      - node-modules:/workspace/node_modules
      - npm-cache:/cache/npm
      - artifacts:/artifacts
      - certificates:/certificates
    shm_size: 1gb
  relay:
    build:
      context: .
      dockerfile: containers/Relay.Dockerfile
    command: ["/config/relay.toml"]
    volumes:
      - ./spikes/transport/relay.toml:/config/relay.toml:ro
    init: true
  authority:
    <<: *dev
    command: ["cargo", "run", "--locked", "-p", "th-authority"]
    depends_on: [relay]
  web:
    <<: *dev
    command: ["npx", "vite", "apps/web", "--host", "0.0.0.0"]
  browser:
    <<: *dev
    profiles: ["test"]
    command: ["node", "tests/e2e.mjs"]
  visual-browser:
    <<: *dev
    profiles: ["visual"]
    command: ["node", "containers/visual-browser.mjs"]
    depends_on: [web]
    ports:
      - "127.0.0.1::9222"
    volumes:
      - .:/workspace
      - cargo-registry:/usr/local/cargo/registry
      - cargo-git:/usr/local/cargo/git
      - target:/build/target
      - node-modules:/workspace/node_modules
      - npm-cache:/cache/npm
      - artifacts:/artifacts
      - certificates:/certificates
      - visual-profile:/browser-profile
volumes:
  cargo-registry:
  cargo-git:
  target:
  node-modules:
  npm-cache:
  artifacts:
  certificates:
  visual-profile:
