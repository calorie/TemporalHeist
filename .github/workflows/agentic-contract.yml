name: agentic-contract

on:
  pull_request:
    paths:
      - 'README.md'
      - 'CLAUDE.md'
      - 'AGENTS.md'
      - '.claude/**'
      - '.codex/**'
      - '.agentic/**'
      - '.github/pull_request_template.md'
      - '.github/dependabot.yml'
      - '.github/workflows/agentic-contract.yml'
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'CLAUDE.md'
      - 'AGENTS.md'
      - '.claude/**'
      - '.codex/**'
      - '.agentic/**'
      - '.github/pull_request_template.md'
      - '.github/dependabot.yml'
      - '.github/workflows/agentic-contract.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build container toolchain
        run: sh container ci-contract build dev
      - name: Validate agent infrastructure in container
        run: sh container ci-contract run --rm dev python3 containers/agentic-contract.py
      - name: Remove isolated stack
        if: always()
        run: sh container ci-contract down --volumes --remove-orphans
