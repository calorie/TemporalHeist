name: agentic-contract

on:
  pull_request:
    paths:
      - 'README.md'
      - 'CLAUDE.md'
      - 'AGENTS.md'
      - '.claude/**'
      - '.codex/**'
      - '.agentic/**'
      - '.github/pull_request_template.md'
      - '.github/dependabot.yml'
      - '.github/workflows/agentic-contract.yml'
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'CLAUDE.md'
      - 'AGENTS.md'
      - '.claude/**'
      - '.codex/**'
      - '.agentic/**'
      - '.github/pull_request_template.md'
      - '.github/dependabot.yml'
      - '.github/workflows/agentic-contract.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          check-latest: true
      - name: Validate runtime configuration
        run: |
          python3 - <<'PY'
          import json, tomllib

          with open(".claude/settings.json", encoding="utf-8") as f:
              claude = json.load(f)
          assert "ultracode" not in claude
          assert claude["enabledPlugins"]["agentic-engineering@agentic-engineering"] is True
          claude_ask = set(claude["permissions"]["ask"])
          assert "Bash(gh pr merge *)" in claude_ask
          assert "Bash(git merge *)" in claude_ask
          assert "Bash(git push origin main *)" in claude_ask
          assert "Bash(git push origin master *)" in claude_ask
          assert "Bash(git push origin trunk *)" in claude_ask

          with open(".codex/config.toml", "rb") as f:
              codex = tomllib.load(f)

          assert codex["model"] == "gpt-5.6-sol"
          assert codex["model_reasoning_effort"] == "low"
          assert codex["agents"]["enabled"] is True
          assert codex["agents"]["default_subagent_model"] == "gpt-5.6-terra"
          assert codex["agents"]["default_subagent_reasoning_effort"] == "medium"
          assert set(codex["agents"]) == {
              "enabled",
              "default_subagent_model",
              "default_subagent_reasoning_effort",
          }
          assert codex["plugins"]["agentic-engineering@agentic-engineering"]["enabled"] is True
          assert codex["default_permissions"] == "agentic-development"

          granular = codex["approval_policy"]["granular"]
          assert granular["sandbox_approval"] is False
          assert granular["rules"] is True
          assert granular["request_permissions"] is False

          profile = codex["permissions"]["agentic-development"]
          assert profile["extends"] == ":workspace"
          assert profile["filesystem"][":workspace_roots"][".git"] == "write"
          assert profile["network"]["enabled"] is True
          PY
      - name: Enforce English agent infrastructure
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          pattern = re.compile(r"[\u3040-\u30ff\u3400-\u9fff\uff66-\uff9f]")
          paths = [
              Path("README.md"),
              Path("CLAUDE.md"),
              Path("AGENTS.md"),
              Path(".agentic/PROJECT.md"),
              Path(".codex/config.toml"),
              Path(".codex/rules/approval-boundaries.rules"),
              Path(".github/pull_request_template.md"),
          ]

          failures = []
          for path in paths:
              text = path.read_text(encoding="utf-8")
              match = pattern.search(text)
              if match:
                  line = text.count("\n", 0, match.start()) + 1
                  failures.append(f"{path}:{line}")

          if failures:
              raise SystemExit("Non-English text detected: " + ", ".join(failures))
          PY
      - name: Validate approval boundary rules
        run: |
          grep -F 'pattern = ["gh", "pr", "merge"]' .codex/rules/approval-boundaries.rules
          grep -F 'decision = "prompt"' .codex/rules/approval-boundaries.rules
      - name: Check minimal layout
        run: |
          test -f CLAUDE.md
          test -f AGENTS.md
          test -f .agentic/PROJECT.md
          test -f .claude/settings.json
          test -f .codex/config.toml
          test -f .codex/rules/approval-boundaries.rules
          test -d .agent/tasks
          test ! -e .agentic/agentic.json
          test ! -d .codex/agents
          test ! -d scripts
          test ! -d .agent/plans
