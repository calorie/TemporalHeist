name: vertical-slice

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: vertical-slice-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  component-verification:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Component and protocol checks
        run: sh container ci-verify verify
      - name: Remove isolated stack
        if: always()
        run: sh container ci-verify down --volumes --remove-orphans

  acceptance:
    if: github.event_name == 'push' || github.base_ref == 'main' || contains(github.event.pull_request.labels.*.name, 'full-stack')
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Two-browser MoQ/WebGPU acceptance
        run: sh container ci-acceptance acceptance
      - name: Remove isolated stack
        if: always()
        run: sh container ci-acceptance down --volumes --remove-orphans
