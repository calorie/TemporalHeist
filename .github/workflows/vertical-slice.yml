name: vertical-slice

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  container-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Component and protocol checks
        run: sh container ci-verify verify
      - name: Two-browser MoQ/WebGPU acceptance
        run: sh container ci-acceptance acceptance
      - name: Remove isolated stacks
        if: always()
        run: |
          sh container ci-verify down --volumes --remove-orphans
          sh container ci-acceptance down --volumes --remove-orphans
